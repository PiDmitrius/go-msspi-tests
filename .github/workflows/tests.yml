name: tests
on: push

env:
  golang-version: '1.26.4'
  go-cpro-version: 'v1.26.4-msspi-1'

jobs:
  matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          certs: true
        - os: windows-2022
          certs: true
    name: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.golang-version }}

    - name: Setup CryptoPro/go (modified stdlib + msspi .a)
      env:
        PROJECTTAG: ${{ env.go-cpro-version }}
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        git -c advice.detachedHead=false clone --depth 1 --branch "$PROJECTTAG" https://github.com/CryptoPro/go.git
        cd go
        git submodule update --init --recursive --depth 1
        cd src/go-msspi/msspi/build_linux
        make -B static
        if [ "$RUNNER_OS" != "Windows" ]; then make -B static-capix; fi
        cp -rf "$RUNNER_TEMP/go/src" "$(go env GOROOT)"

    - name: Install CryptoPro CSP
      env:
        CPRO_BASE_URL: ${{ secrets.CPRO_BASE_URL }}
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        case "$RUNNER_OS" in
          Linux)
            curl -fsSL -o CSP.tgz  "${CPRO_BASE_URL}linux-amd64_deb.tgz"
            curl -fsSL -o dsrf.tar "${CPRO_BASE_URL}dsrf.tar"
            tar xzf CSP.tgz
            ( cd linux-amd64_deb && sudo ./install.sh kc1 )
            sudo mkdir -p /var/opt/cprocsp/dsrf
            sudo tar xf "$RUNNER_TEMP/dsrf.tar" -C /var/opt/cprocsp/dsrf
            CPCONFIG=/opt/cprocsp/sbin/amd64/cpconfig
            sudo "$CPCONFIG" -ini '\config\keydevices\hdimage\default' -add long 'long_names' 1
            sudo "$CPCONFIG" -ini '\config\parameters' -add long 'dynamic_readers' 0
            me="$(id -un):$(id -gn)"
            sudo mkdir -p "/var/opt/cprocsp/keys/$(id -un)" "/var/opt/cprocsp/users/$(id -un)" /var/opt/cprocsp/tmp
            sudo chown -R "$me" /etc/opt/cprocsp /var/opt/cprocsp/keys /var/opt/cprocsp/users /var/opt/cprocsp/tmp /var/opt/cprocsp/dsrf
            LIC="$(curl -fsSL "${CPRO_BASE_URL}license.txt" | tr -d '[:space:]')"
            "$CPCONFIG" -license -set "$LIC"
            ;;
          Windows)
            curl -fsSL -o csp.msi "${CPRO_BASE_URL}csp-x64.msi"
            start //wait msiexec //qn //i csp.msi REBOOT=R KCLEVEL=1
            ;;
        esac

    - name: Issue CSP certificates (Linux, GOST + RSA, server + client)
      if: ${{ matrix.certs && runner.os == 'Linux' }}
      shell: bash
      run: |
        CRYPTCP=/opt/cprocsp/bin/amd64/cryptcp
        CERTMGR=/opt/cprocsp/bin/amd64/certmgr
        CA=http://cryptopro.ru/certsrv
        certs="$RUNNER_TEMP/certs"; mkdir -p "$certs"
        create_cert() {
          local provtype="$1" dn="$2" container="$3" usage="$4" dest="$5"
          printf 'o\n' | "$CRYPTCP" -creatcert \
            -provtype "$provtype" -cont "\\\\.\\HDIMAGE\\$container" \
            -dn "$dn" -certusage "$usage" -ku -du -both -exprt \
            -tpassword '' -pin '' -ca "$CA"
          "$CERTMGR" -export -cert -dest "$dest" -cont "\\\\.\\HDIMAGE\\$container"
        }
        create_cert 80 'CN=127.0.0.1'    server_gost_cont '1.3.6.1.5.5.7.3.1' "$certs/server_gost.cer"
        create_cert 80 'CN=msspi-client' client_gost_cont '1.3.6.1.5.5.7.3.2' "$certs/client_gost.cer"
        create_cert 24 'CN=127.0.0.1'    server_rsa_cont  '1.3.6.1.5.5.7.3.1' "$certs/server_rsa.cer"
        create_cert 24 'CN=msspi-client' client_rsa_cont  '1.3.6.1.5.5.7.3.2' "$certs/client_rsa.cer"
        {
          echo "CSP_SERVER_GOST_CERT=$certs/server_gost.cer"
          echo "CSP_CLIENT_GOST_CERT=$certs/client_gost.cer"
          echo "CSP_SERVER_RSA_CERT=$certs/server_rsa.cer"
          echo "CSP_CLIENT_RSA_CERT=$certs/client_rsa.cer"
        } >> "$GITHUB_ENV"

    - name: Issue CSP certificates (Windows, GOST + RSA, server + client)
      if: ${{ matrix.certs && runner.os == 'Windows' }}
      env:
        CPRO_BASE_URL: ${{ secrets.CPRO_BASE_URL }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $CA = 'http://cryptopro.ru/certsrv'
        $certs = Join-Path $env:RUNNER_TEMP 'certs'
        New-Item -ItemType Directory -Force -Path $certs | Out-Null
        # cryptcp.exe is a separate Windows download (not bundled in csp-x64.msi)
        $cryptcp = Join-Path $certs 'cryptcp.exe'
        curl.exe -fsSL -o $cryptcp "$($env:CPRO_BASE_URL)cryptcp.exe"
        if ($LASTEXITCODE -ne 0) { throw 'cryptcp.exe download failed' }
        # trust the issuing CA root (best-effort; the Linux lane does not need it)
        $cacert = Join-Path $certs 'cacert.cer'
        curl.exe -sSL -k -o $cacert "$CA/certnew.cer?ReqID=CACert&Renewal=-1&Enc=bin"
        certutil -enterprise -addstore -f root $cacert 2>$null
        if ($LASTEXITCODE -ne 0) { certutil -addstore -f root $cacert 2>$null }
        # headless GOST key-gen needs the DSRF "source material" RNG, else
        # cryptcp -creatcert fails with 0x80090022 NTE_SILENT_CONTEXT (KC1 defaults to
        # the interactive biological RNG). Lay down the dsrf reserve and register it in
        # BOTH registry views (cryptcp.exe is 32-bit → reads WOW6432Node).
        $dsrfTar = Join-Path $certs 'dsrf.tar'
        curl.exe -fsSL -o $dsrfTar "$($env:CPRO_BASE_URL)dsrf.tar"
        $dsrf = Join-Path $env:RUNNER_TEMP 'dsrf'
        New-Item -ItemType Directory -Force -Path $dsrf | Out-Null
        tar.exe -xf $dsrfTar -C $dsrf
        foreach ($rk in @(
            'HKLM:\SOFTWARE\Crypto Pro\Cryptography\CurrentVersion\Random\CPSD\Default',
            'HKLM:\SOFTWARE\WOW6432Node\Crypto Pro\Cryptography\CurrentVersion\Random\CPSD\Default')) {
          New-Item -Path $rk -Force | Out-Null
          New-ItemProperty -Path $rk -Name '/db1/kis_1' -Value "$dsrf\db1\kis_1" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $rk -Name '/db2/kis_1' -Value "$dsrf\db2\kis_1" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $rk -Name 'Level' -Value 1 -PropertyType DWord -Force | Out-Null
        }
        # the Default data paths alone aren't enough — the CPSD device must be REGISTERED
        # in the RNG list (Linux does `cpconfig -hardware rndm -add CPSD`). Windows ships
        # cpconfig.exe; find it and add the device, made most-preferred (-level 1).
        $cpconfig = (Get-ChildItem 'C:\Program Files\Crypto Pro','C:\Program Files (x86)\Crypto Pro' -Recurse -Filter 'cpconfig*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        Write-Host "cpconfig: $cpconfig"
        if ($cpconfig) {
          & $cpconfig -hardware rndm -add CPSD -name 'CPSD RNG' -level 1 2>&1 | Write-Host
          & $cpconfig -hardware rndm -view 2>&1 | Write-Host
        } else {
          Write-Host 'cpconfig.exe NOT found - CryptoPro exes present:'
          Get-ChildItem 'C:\Program Files\Crypto Pro','C:\Program Files (x86)\Crypto Pro' -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
        }
        # issue 4 certs; on Windows the key container is auto-selected (no -cont needed)
        function New-CspCert($provtype, $dn, $usage) {
          & $cryptcp -creatcert -silent -provtype $provtype -dn $dn -certusage $usage -ku -du -both -exprt -ca $CA
          if ($LASTEXITCODE -ne 0) { throw "cryptcp -creatcert failed: $dn provtype=$provtype" }
        }
        New-CspCert 80 'CN=127.0.0.1'    '1.3.6.1.5.5.7.3.1'
        New-CspCert 80 'CN=msspi-client' '1.3.6.1.5.5.7.3.2'
        New-CspCert 24 'CN=127.0.0.1'    '1.3.6.1.5.5.7.3.1'
        New-CspCert 24 'CN=msspi-client' '1.3.6.1.5.5.7.3.2'
        # export each leaf to a DER .cer (the format the fork's X509KeyPair expects);
        # CN alone is ambiguous (GOST & RSA share it) so also match the key algorithm
        function Export-Leaf($subject, $gost, $name) {
          $dest = Join-Path $certs $name
          $c = Get-ChildItem Cert:\CurrentUser\My | Where-Object {
            $_.Subject -eq $subject -and ($(if ($gost) { $_.GetKeyAlgorithm() -like '1.2.643.*' } else { $_.GetKeyAlgorithm() -eq '1.2.840.113549.1.1.1' }))
          } | Select-Object -First 1
          if (-not $c) { throw "leaf cert not found: $subject gost=$gost" }
          Export-Certificate -Cert $c -FilePath $dest -Type CERT -Force | Out-Null
          Write-Host "exported $subject gost=$gost -> $dest"
          return $dest
        }
        $sg = Export-Leaf 'CN=127.0.0.1'    $true  'server_gost.cer'
        $cg = Export-Leaf 'CN=msspi-client' $true  'client_gost.cer'
        $sr = Export-Leaf 'CN=127.0.0.1'    $false 'server_rsa.cer'
        $cr = Export-Leaf 'CN=msspi-client' $false 'client_rsa.cer'
        Add-Content -Path $env:GITHUB_ENV -Value "CSP_SERVER_GOST_CERT=$sg"
        Add-Content -Path $env:GITHUB_ENV -Value "CSP_CLIENT_GOST_CERT=$cg"
        Add-Content -Path $env:GITHUB_ENV -Value "CSP_SERVER_RSA_CERT=$sr"
        Add-Content -Path $env:GITHUB_ENV -Value "CSP_CLIENT_RSA_CERT=$cr"

    - name: Run matrix
      env:
        CGO_ENABLED: '1'
        GOTOOLCHAIN: local
        MSSPI_EXTERNAL: '1'
      shell: bash
      run: |
        go test -tags=msspi -v -count=1 -timeout 120s ./...
